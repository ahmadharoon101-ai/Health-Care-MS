<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Healthcare Management System</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/shell.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4 6.5v5.6C4 17 7.6 21 12 22c4.4-1 8-5 8-9.9V6.5L12 3Z" stroke="currentColor" stroke-width="1.6"/></svg>
        </div>
        <div>
          <div class="auth-title">Welcome back</div>
          <div class="auth-subtitle">Log in to the Healthcare Management System</div>
        </div>
      </div>

      <div class="auth-alert error" id="authError" hidden></div>
      <div class="auth-alert success" id="authSuccess" hidden></div>

      <form class="auth-form" id="loginForm">
        <div class="field">
          <label for="identifier">Email or username</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="justify-content:center;">Log In</button>
      </form>

      <div class="auth-footer">Don't have an account? <a href="/signup.html">Sign up</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = "/dashboard.html";

    const params = new URLSearchParams(window.location.search);
    const successEl = document.getElementById("authSuccess");
    if (params.get("registered") === "1") {
      successEl.textContent = "Account created successfully. Please login to continue.";
      successEl.hidden = false;
    }

    const errorEl = document.getElementById("authError");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    togglePassword.addEventListener("click", () => {
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Logging in…";
      try {
        const data = await apiFetch("/api/auth/login", {
          method: "POST",
          noAuth: true,
          body: JSON.stringify({
            identifier: document.getElementById("identifier").value.trim(),
            password: passwordInput.value,
          }),
        });
        Auth.setSession(data.access_token, data.user);
        window.location.href = "/dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
